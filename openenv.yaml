spec_version: 1
name: email-triage-env
type: space
runtime: fastapi
app: server.app:app
port: 7860
version: 1.0.0
description: >
  OpenEnv-compatible environment for evaluating AI email triage decisions
  across easy, medium, and hard support inbox scenarios.
entry_point: server.environment:EmailTriageEnvironment
environment:
  class: server.environment.EmailTriageEnvironment
  init_params: {}
  methods:
    reset:
      description: Reset the environment for a selected task and return the initial observation.
      params:
        task_name:
          type: string
          enum: [easy_triage, medium_triage, hard_triage]
      returns: observation
    step:
      description: Submit a triage action and return (observation, reward, done).
      params:
        action:
          type: object
      returns: [observation, reward, done]
    state:
      description: Return current environment state metadata.
      returns: state

actions:
  - name: triage_email
    description: Submit a structured triage decision for the current email.

observations:
  type: object
  properties:
    email_id:
      type: string
    subject:
      type: string
    body:
      type: string
    sender_email:
      type: string
    sender_name:
      type: string
    task_name:
      type: string
    reward:
      type: number
    done:
      type: boolean

rewards:
  type: partial
  total: 1.0
  description: Composite triage scoring with deterministic grading and shaping.

agent:
  class: server.environment.EmailTriageEnvironment
  deterministic: true
  description: Stateless evaluation agent consuming task-specific email streams.

api:
  base_url: /
  endpoints:
    reset:
      method: POST
      path: /reset
    step:
      method: POST
      path: /step
    state:
      method: GET
      path: /state
    tasks:
      method: GET
      path: /tasks
    grader:
      method: POST
      path: /grader

tasks:
  - id: easy_triage
    task_id: easy_triage
    name: easy_triage
    difficulty: easy
    description: "5 clear-signal emails — unambiguous priority, category, routing"
    max_steps: 5
    reset_params:
      task_name: easy_triage
    action_schema:
      priority: "urgent | high | normal | low"
      category: "billing | technical_support | feature_request | bug_report | account_management | sales_inquiry | general_inquiry | spam"
      routing_target: "tier1_support | tier2_support | billing_team | sales_team | engineering | account_management | spam_filter | escalation"
      sentiment: "positive | neutral | negative | very_negative"
      requires_followup: boolean
      summary: string
      suggested_response_tone: "formal | friendly | empathetic | concise"
      tags: "list of strings (0-5)"
      task_id: easy_triage
    grader: server.graders:EasyGrader
    graders:
      - server.graders:EasyGrader
    max_reward: 1.0

  - id: medium_triage
    task_id: medium_triage
    name: medium_triage
    difficulty: medium
    description: "5 emails with mixed signals, thread context, multi-part issues"
    max_steps: 5
    reset_params:
      task_name: medium_triage
    action_schema:
      priority: "urgent | high | normal | low"
      category: "billing | technical_support | feature_request | bug_report | account_management | sales_inquiry | general_inquiry | spam"
      routing_target: "tier1_support | tier2_support | billing_team | sales_team | engineering | account_management | spam_filter | escalation"
      sentiment: "positive | neutral | negative | very_negative"
      requires_followup: boolean
      summary: string
      suggested_response_tone: "formal | friendly | empathetic | concise"
      tags: "list of strings (0-5)"
      task_id: medium_triage
    grader: server.graders:MediumGrader
    graders:
      - server.graders:MediumGrader
    max_reward: 1.0

  - id: hard_triage
    task_id: hard_triage
    name: hard_triage
    difficulty: hard
    description: "5 ambiguous emails with churn risk, legal implications, competing signals"
    max_steps: 5
    reset_params:
      task_name: hard_triage
    action_schema:
      priority: "urgent | high | normal | low"
      category: "billing | technical_support | feature_request | bug_report | account_management | sales_inquiry | general_inquiry | spam"
      routing_target: "tier1_support | tier2_support | billing_team | sales_team | engineering | account_management | spam_filter | escalation"
      sentiment: "positive | neutral | negative | very_negative"
      requires_followup: boolean
      summary: string
      suggested_response_tone: "formal | friendly | empathetic | concise"
      tags: "list of strings (0-5)"
      task_id: hard_triage
    grader: server.graders:HardGrader
    graders:
      - server.graders:HardGrader
    max_reward: 1.0
